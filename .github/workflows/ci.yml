name: Verify Unisol

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unisol-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          for file in src/*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Unit tests
        run: npm test

      - name: Bundle Worker
        run: npm run build

      - name: Cloudflare dry run
        run: npm run cf:dry-run

      - name: Local Workers runtime smoke test
        shell: bash
        run: |
          cleanup() {
            if [ -n "${WRANGLER_PID:-}" ]; then
              kill "$WRANGLER_PID" 2>/dev/null || true
              wait "$WRANGLER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          cat > .dev.vars <<'EOF'
          UUID="90cd4a77-141a-43c9-991b-08263cfe9c10"
          ADMIN="ci-admin"
          EOF

          npx wrangler dev --ip 127.0.0.1 --port 8787 --local-protocol https > /tmp/unisol-wrangler.log 2>&1 &
          WRANGLER_PID=$!

          ready=0
          for _ in $(seq 1 80); do
            if curl -kfsS https://127.0.0.1:8787/health > /tmp/unisol-health.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/unisol-wrangler.log
            exit 1
          fi

          grep -q '"ok": true' /tmp/unisol-health.json
          grep -q '"configured": true' /tmp/unisol-health.json
          grep -q '"adminConfigured": true' /tmp/unisol-health.json
          curl -kfsS https://127.0.0.1:8787/ | grep -q 'Unisol Coffee'
          curl -kfsS https://127.0.0.1:8787/admin | grep -q 'Unisol Admin'

          curl -kfsS 'https://127.0.0.1:8787/90cd4a77/sub?format=plain' > /tmp/unisol-sub.txt
          grep -q 'type=ws' /tmp/unisol-sub.txt
          grep -q 'type=xhttp' /tmp/unisol-sub.txt

          code=$(curl -ksS -o /tmp/unisol-unauth.txt -w '%{http_code}' https://127.0.0.1:8787/api/config)
          test "$code" = "401"
          curl -kfsS -H 'Authorization: Bearer ci-admin' https://127.0.0.1:8787/api/config > /tmp/unisol-config.json
          grep -q '"kvEnabled": false' /tmp/unisol-config.json

          code=$(curl -ksS -o /tmp/unisol-xhttp.txt -w '%{http_code}' -X POST --data-binary 'bad' https://127.0.0.1:8787/90cd4a77/xhttp)
          test "$code" = "400"

          cleanup
          WRANGLER_PID=''

          cat > .dev.vars <<'EOF'
          UUID="90cd4a77-141a-43c9-991b-08263cfe9c10"
          EOF

          npx wrangler dev --ip 127.0.0.1 --port 8788 --local-protocol https > /tmp/unisol-wrangler-no-admin.log 2>&1 &
          WRANGLER_PID=$!

          ready=0
          for _ in $(seq 1 80); do
            if curl -kfsS https://127.0.0.1:8788/health > /tmp/unisol-health-no-admin.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/unisol-wrangler-no-admin.log
            exit 1
          fi

          grep -q '"adminConfigured": false' /tmp/unisol-health-no-admin.json
          curl -kfsS https://127.0.0.1:8788/admin > /tmp/unisol-admin-no-admin.html
          grep -q 'Unisol Admin' /tmp/unisol-admin-no-admin.html
          grep -q 'ADMIN is not configured' /tmp/unisol-admin-no-admin.html
          code=$(curl -ksS -o /tmp/unisol-no-admin-api.txt -w '%{http_code}' https://127.0.0.1:8788/api/config)
          test "$code" = "401"

          cleanup
          WRANGLER_PID=''
          trap - EXIT

      - name: Verify bundle
        run: |
          test -s dist/_worker.js
          grep -q "cloudflare:sockets" dist/_worker.js
          wc -c dist/_worker.js
          find dist/wrangler -maxdepth 2 -type f -print

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: unisol-worker-${{ github.sha }}
          path: dist/_worker.js
          if-no-files-found: error
          retention-days: 14
