name: Verify Unisol

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          for file in src/*.js tests/*.mjs; do
            node --check "$file"
          done

      - name: Unit tests
        run: npm test

      - name: Bundle Worker
        run: npm run build

      - name: Cloudflare dry run
        run: npm run cf:dry-run

      - name: Verify bundle
        run: |
          test -s dist/_worker.js
          grep -q "cloudflare:sockets" dist/_worker.js
          wc -c dist/_worker.js
          find dist/wrangler -type f -maxdepth 2 -print

      - name: Upload Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: unisol-worker-${{ github.sha }}
          path: dist/_worker.js
          if-no-files-found: error
          retention-days: 14
